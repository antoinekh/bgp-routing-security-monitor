# DNS-OARC 47 demo: the route-leak half of the 27 June 2024 1.1.1.1 incident.
# Deploy with ./deploy.sh, not containerlab directly: it sets ROUTINATOR_CMD,
# ROUTINATOR_CACHE_DIR, GRAFANA_PORT and GRAFANA_ADMIN_PASSWORD from .env and
# applies netem.
#
#   cf-yvr AS13335 ── transit AS64510 ── vantage AS64500 ── probe
#                                          │ (IX peer, local-pref 200)
#   cf-gru AS13335 ── as7738 ── as53072 ══ as262504 ── as1031
#                                   (150 ms netem)
#
# Only Grafana publishes a host port. Everything else talks over the mgmt
# network 172.31.47.0/24.
name: dnsoarc

mgmt:
  network: dnsoarc-mgmt
  ipv4-subnet: 172.31.47.0/24

topology:
  defaults:
    kind: linux

  nodes:
    # ── Routers ────────────────────────────────────────────────────────────
    # Each router drops the mgmt default route (exec) so that a missing BGP
    # route never sends demo traffic to the real 1.1.1.1 through the host.
    vantage:
      image: quay.io/frrouting/frr:10.7.1
      mgmt-ipv4: 172.31.47.11
      sysctls: { net.ipv4.ip_forward: 1 }
      binds:
        - configs/frr/daemons:/etc/frr/daemons
        - configs/frr/vtysh.conf:/etc/frr/vtysh.conf
        - configs/frr/vantage.conf:/etc/frr/frr.conf
      exec: [ "ip route del default" ]
    transit:
      image: quay.io/frrouting/frr:10.7.1
      mgmt-ipv4: 172.31.47.12
      sysctls: { net.ipv4.ip_forward: 1 }
      binds:
        - configs/frr/daemons:/etc/frr/daemons
        - configs/frr/vtysh.conf:/etc/frr/vtysh.conf
        - configs/frr/transit.conf:/etc/frr/frr.conf
      exec: [ "ip route del default" ]
    cf-yvr:
      image: quay.io/frrouting/frr:10.7.1
      mgmt-ipv4: 172.31.47.13
      sysctls: { net.ipv4.ip_forward: 1 }
      binds:
        - configs/frr/daemons:/etc/frr/daemons
        - configs/frr/vtysh.conf:/etc/frr/vtysh.conf
        - configs/frr/cf-yvr.conf:/etc/frr/frr.conf
      exec: [ "ip route del default" ]
    cf-gru:
      image: quay.io/frrouting/frr:10.7.1
      mgmt-ipv4: 172.31.47.14
      sysctls: { net.ipv4.ip_forward: 1 }
      binds:
        - configs/frr/daemons:/etc/frr/daemons
        - configs/frr/vtysh.conf:/etc/frr/vtysh.conf
        - configs/frr/cf-gru.conf:/etc/frr/frr.conf
      exec: [ "ip route del default" ]
    as7738:
      image: quay.io/frrouting/frr:10.7.1
      mgmt-ipv4: 172.31.47.15
      sysctls: { net.ipv4.ip_forward: 1 }
      binds:
        - configs/frr/daemons:/etc/frr/daemons
        - configs/frr/vtysh.conf:/etc/frr/vtysh.conf
        - configs/frr/as7738.conf:/etc/frr/frr.conf
      exec: [ "ip route del default" ]
    as53072:
      image: quay.io/frrouting/frr:10.7.1
      mgmt-ipv4: 172.31.47.16
      sysctls: { net.ipv4.ip_forward: 1 }
      binds:
        - configs/frr/daemons:/etc/frr/daemons
        - configs/frr/vtysh.conf:/etc/frr/vtysh.conf
        - configs/frr/as53072.conf:/etc/frr/frr.conf
      exec: [ "ip route del default" ]
    as262504:
      image: quay.io/frrouting/frr:10.7.1
      mgmt-ipv4: 172.31.47.17
      sysctls: { net.ipv4.ip_forward: 1 }
      binds:
        - configs/frr/daemons:/etc/frr/daemons
        - configs/frr/vtysh.conf:/etc/frr/vtysh.conf
        - configs/frr/as262504.conf:/etc/frr/frr.conf
      exec: [ "ip route del default" ]
    as1031:
      image: quay.io/frrouting/frr:10.7.1
      mgmt-ipv4: 172.31.47.18
      sysctls: { net.ipv4.ip_forward: 1 }
      binds:
        - configs/frr/daemons:/etc/frr/daemons
        - configs/frr/vtysh.conf:/etc/frr/vtysh.conf
        - configs/frr/as1031.conf:/etc/frr/frr.conf
      exec: [ "ip route del default" ]

    # ── Anycast DNS ────────────────────────────────────────────────────────
    # The CoreDNS image has no shell or ip tool, so a netshoot sidecar
    # (dns-*-net) shares each CoreDNS node's network namespace and
    # configures it: 1.1.1.1/32 on lo, the link address, and a default route
    # via the cf router in place of the mgmt one.
    dns-yvr:
      image: coredns/coredns:1.12.1
      mgmt-ipv4: 172.31.47.21
      binds:
        - configs/coredns/yvr:/etc/coredns:ro
      cmd: -conf /etc/coredns/Corefile
    dns-yvr-net:
      image: nicolaka/netshoot:v0.13
      network-mode: container:dns-yvr
      cmd: sleep infinity
      exec:
        - ip addr add 1.1.1.1/32 dev lo
        - ip addr add 10.47.5.2/30 dev eth1
        - ip route replace default via 10.47.5.1 dev eth1
    dns-gru:
      image: coredns/coredns:1.12.1
      mgmt-ipv4: 172.31.47.22
      binds:
        - configs/coredns/gru:/etc/coredns:ro
      cmd: -conf /etc/coredns/Corefile
    dns-gru-net:
      image: nicolaka/netshoot:v0.13
      network-mode: container:dns-gru
      cmd: sleep infinity
      exec:
        - ip addr add 1.1.1.1/32 dev lo
        - ip addr add 10.47.7.2/30 dev eth1
        - ip route replace default via 10.47.7.1 dev eth1

    # ── Probe: a customer of vantage, querying 1.1.1.1 ─────────────────────
    probe:
      image: nicolaka/netshoot:v0.13
      mgmt-ipv4: 172.31.47.23
      binds:
        - configs/probe/probe.sh:/probe.sh:ro
      exec:
        - ip addr add 198.51.100.10/24 dev eth1
        - ip route replace default via 198.51.100.1 dev eth1
      cmd: bash /probe.sh

    # ── RAVEN ──────────────────────────────────────────────────────────────
    raven:
      image: debian:12.11-slim
      mgmt-ipv4: 172.31.47.31
      binds:
        - bin/raven:/usr/local/bin/raven:ro
        - configs/raven/raven.yaml:/etc/raven/raven.yaml:ro
      cmd: /usr/local/bin/raven serve --config /etc/raven/raven.yaml

    # ── RPKI ───────────────────────────────────────────────────────────────
    # ROUTINATOR_CMD (set by deploy.sh from RPKI_MODE) picks the TALs: the
    # Krill testbed TA only (lab) or the five bundled RIR TALs (live).
    routinator:
      image: nlnetlabs/routinator:v0.15.2
      mgmt-ipv4: 172.31.47.32
      binds:
        - ${ROUTINATOR_CACHE_DIR}:/repository
        - runtime/routinator/tals:/tals:ro
        - runtime/krill/ca.pem:/krill-ca.pem:ro
      cmd: ${ROUTINATOR_CMD}
    krill:
      image: nlnetlabs/krill:v0.16.0
      mgmt-ipv4: 172.31.47.33
      binds:
        - runtime/krill/data:/var/krill/data
        - configs/krill/krill.conf:/etc/krill.conf:ro
      cmd: krill -c /etc/krill.conf
    # rsync for Krill's repository and TA certificate (the rsync URIs in the
    # TAL and certificates point here). The Routinator image ships rsync.
    krill-rsync:
      image: nlnetlabs/routinator:v0.15.2
      mgmt-ipv4: 172.31.47.34
      entrypoint: rsync
      binds:
        - configs/krill/rsyncd.conf:/etc/rsyncd.conf:ro
        # The parent, not current/: Krill replaces current/ when it publishes.
        - runtime/krill/data/repo/rsync:/srv/rsync:ro
        - runtime/krill/ta:/srv/ta:ro
      cmd: --daemon --no-detach --config=/etc/rsyncd.conf

    # ── Observability ──────────────────────────────────────────────────────
    prometheus:
      image: prom/prometheus:v3.10.0
      mgmt-ipv4: 172.31.47.35
      binds:
        - configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    grafana:
      image: grafana/grafana:12.4.1
      mgmt-ipv4: 172.31.47.36
      ports:
        - ${GRAFANA_PORT}:3000
      env:
        GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
        GF_AUTH_ANONYMOUS_ENABLED: "true"
        GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
        GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/raven.json
      binds:
        - configs/grafana/provisioning:/etc/grafana/provisioning:ro
        - runtime/grafana/dashboards:/var/lib/grafana/dashboards:ro

  links:
    - endpoints: ["vantage:eth1", "transit:eth1"]    # 10.47.1.0/30
    - endpoints: ["vantage:eth2", "as1031:eth1"]     # 10.47.2.0/30
    - endpoints: ["vantage:eth3", "probe:eth1"]      # 198.51.100.0/24
    - endpoints: ["transit:eth2", "cf-yvr:eth1"]     # 10.47.4.0/30, netem 5 ms
    - endpoints: ["cf-yvr:eth2", "dns-yvr:eth1"]     # 10.47.5.0/30
    - endpoints: ["as7738:eth1", "cf-gru:eth1"]      # 10.47.6.0/30
    - endpoints: ["cf-gru:eth2", "dns-gru:eth1"]     # 10.47.7.0/30
    - endpoints: ["as7738:eth2", "as53072:eth1"]     # 10.47.8.0/30
    - endpoints: ["as53072:eth2", "as262504:eth1"]   # 10.47.9.0/30, netem
    - endpoints: ["as262504:eth2", "as1031:eth2"]    # 10.47.10.0/30
