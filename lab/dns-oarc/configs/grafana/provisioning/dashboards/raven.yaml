# The dashboard is lab/grafana-dashboard.json, copied by bootstrap.sh into
# runtime/grafana/dashboards with its ${DS_PROMETHEUS} input bound to the
# provisioned datasource. The original file is not modified.
apiVersion: 1
providers:
  - name: raven
    type: file
    disableDeletion: true
    options:
      path: /var/lib/grafana/dashboards
