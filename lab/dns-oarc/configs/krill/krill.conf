# Krill in testbed mode: an embedded TA ("ta") and a CA ("testbed") holding
# all resources. bootstrap.sh issues the demo's ROA and ASPA in "testbed".
# Mounted read-only at /etc/krill.conf: the image's entrypoint otherwise
# appends a log_level line to the end of the file, inside [testbed].
ip = "0.0.0.0"
port = 3000
https_mode = "existing"         # data/ssl/{cert,key}.pem, made by bootstrap.sh
storage_uri = "/var/krill/data/"
service_uri = "https://172.31.47.33:3000/"
admin_token = "dnsoarc-lab-token"
log_type = "stderr"
log_level = "info"

[testbed]
rrdp_base_uri = "https://172.31.47.33:3000/rrdp/"
rsync_jail = "rsync://172.31.47.34/repo/"
ta_uri = "https://172.31.47.33:3000/ta/ta.cer"
ta_aia = "rsync://172.31.47.34/ta/ta.cer"
