! cf-yvr AS13335: originates 1.1.1.0/24 for the anycast resolver behind it.
frr defaults traditional
hostname cf-yvr
log syslog informational
ip forwarding
service integrated-vtysh-config
!
interface eth1
 description transit AS64510
 ip address 10.47.4.2/30
exit
interface eth2
 description cf-yvr resolver
 ip address 10.47.5.1/30
exit
!
ip route 1.1.1.0/24 10.47.5.2
!
ip prefix-list ANYCAST seq 10 permit 1.1.1.0/24
route-map TO-UPSTREAM permit 10
 match ip address prefix-list ANYCAST
exit
!
router bgp 13335
 bgp router-id 10.47.4.2
 no bgp ebgp-requires-policy
 neighbor 10.47.4.1 remote-as 64510
 neighbor 10.47.4.1 description transit
 !
 address-family ipv4 unicast
  network 1.1.1.0/24
  neighbor 10.47.4.1 route-map TO-UPSTREAM out
 exit-address-family
exit
!
end
