! cf-gru AS13335: originates 1.1.1.0/24 for the anycast resolver behind it.
frr defaults traditional
hostname cf-gru
log syslog informational
ip forwarding
service integrated-vtysh-config
!
interface eth1
 description as7738 AS7738
 ip address 10.47.6.2/30
exit
interface eth2
 description cf-gru resolver
 ip address 10.47.7.1/30
exit
!
ip route 1.1.1.0/24 10.47.7.2
!
ip prefix-list ANYCAST seq 10 permit 1.1.1.0/24
route-map TO-UPSTREAM permit 10
 match ip address prefix-list ANYCAST
exit
!
router bgp 13335
 bgp router-id 10.47.6.2
 no bgp ebgp-requires-policy
 neighbor 10.47.6.1 remote-as 7738
 neighbor 10.47.6.1 description as7738
 !
 address-family ipv4 unicast
  network 1.1.1.0/24
  neighbor 10.47.6.1 route-map TO-UPSTREAM out
 exit-address-family
exit
!
end
