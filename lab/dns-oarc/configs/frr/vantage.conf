! vantage AS64500: the operator's edge, the router RAVEN monitors.
! transit AS64510 is its provider (local-pref 100); as1031 is an IX peer
! (local-pref 200), so a route from as1031 wins over transit's.
frr defaults traditional
hostname vantage
log syslog informational
ip forwarding
service integrated-vtysh-config
!
interface eth1
 description transit AS64510
 ip address 10.47.1.2/30
exit
interface eth2
 description ix-peer AS1031
 ip address 10.47.2.1/30
exit
interface eth3
 description probe (customer)
 ip address 198.51.100.1/24
exit
!
ip prefix-list OWN seq 10 permit 198.51.100.0/24
!
route-map FROM-TRANSIT permit 10
 set local-preference 100
exit
route-map FROM-AS1031 permit 10
 set local-preference 200
exit
! Export only the customer prefix, to transit and to the IX peer.
route-map TO-NEIGHBORS permit 10
 match ip address prefix-list OWN
exit
!
router bgp 64500
 bgp router-id 10.47.1.2
 no bgp ebgp-requires-policy
 no bgp network import-check
 neighbor 10.47.1.1 remote-as 64510
 neighbor 10.47.1.1 description transit
 neighbor 10.47.2.2 remote-as 1031
 neighbor 10.47.2.2 description ix-peer-as1031
 !
 address-family ipv4 unicast
  network 198.51.100.0/24
  ! Keep each peer's pre-policy Adj-RIB-In, which BMP pre-policy
  ! monitoring replays to RAVEN.
  neighbor 10.47.1.1 soft-reconfiguration inbound
  neighbor 10.47.2.2 soft-reconfiguration inbound
  neighbor 10.47.1.1 route-map FROM-TRANSIT in
  neighbor 10.47.1.1 route-map TO-NEIGHBORS out
  neighbor 10.47.2.2 route-map FROM-AS1031 in
  neighbor 10.47.2.2 route-map TO-NEIGHBORS out
 exit-address-family
 !
 bmp targets raven
  bmp stats interval 5000
  bmp monitor ipv4 unicast pre-policy
  bmp connect 172.31.47.31 port 11019 min-retry 1000 max-retry 5000
 exit
exit
!
end
