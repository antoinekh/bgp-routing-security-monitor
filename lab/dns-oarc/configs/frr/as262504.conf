! as262504 AS262504: where the leak happens.
! Routes learned from as53072 are tagged with the large community
! 262504:0:53072 (RFC 8092; AS262504 is a 4-byte ASN, so a standard AA:NN
! community cannot carry it). In the normal state TO-AS1031 denies them
! toward as1031. The leak is removing that deny
! (route-map TO-AS1031 deny 10); demo.sh leak / clean toggle it.
frr defaults traditional
hostname as262504
log syslog informational
ip forwarding
service integrated-vtysh-config
!
interface eth1
 description as53072
 ip address 10.47.9.2/30
exit
interface eth2
 description as1031
 ip address 10.47.10.1/30
exit
!
bgp large-community-list standard FROM-AS53072 seq 5 permit 262504:0:53072
!
route-map FROM-AS53072 permit 10
 set large-community 262504:0:53072 additive
exit
route-map TO-AS1031 deny 10
 match large-community FROM-AS53072
exit
route-map TO-AS1031 permit 20
exit
!
router bgp 262504
 bgp router-id 10.47.10.1
 no bgp ebgp-requires-policy
 neighbor 10.47.9.1 remote-as 53072
 neighbor 10.47.9.1 description as53072
 neighbor 10.47.10.2 remote-as 1031
 neighbor 10.47.10.2 description as1031
 !
 address-family ipv4 unicast
  neighbor 10.47.9.1 route-map FROM-AS53072 in
  neighbor 10.47.10.2 route-map TO-AS1031 out
 exit-address-family
exit
!
end
