! transit AS64510: vantage's provider; Cloudflare's YVR site is its peer.
frr defaults traditional
hostname transit
log syslog informational
ip forwarding
service integrated-vtysh-config
!
interface eth1
 description vantage AS64500
 ip address 10.47.1.1/30
exit
interface eth2
 description cf-yvr AS13335
 ip address 10.47.4.1/30
exit
!
router bgp 64510
 bgp router-id 10.47.4.1
 no bgp ebgp-requires-policy
 neighbor 10.47.1.2 remote-as 64500
 neighbor 10.47.1.2 description vantage
 neighbor 10.47.4.2 remote-as 13335
 neighbor 10.47.4.2 description cf-yvr
exit
!
end
