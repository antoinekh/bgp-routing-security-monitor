# RAVEN for the dns-oarc lab. vantage (172.31.47.11) sends BMP Adj-RIB-In
# pre-policy; Routinator (172.31.47.32) is the RTR cache.
bmp:
  listen: "0.0.0.0:11019"
  allowed-routers:
    - 172.31.47.11

# The CLI runs inside this container (docker exec), so loopback is enough.
api:
  listen: "127.0.0.1:11020"

rtr:
  rtr-version: auto
  caches:
    - address: "172.31.47.32:3323"
      preference: 1
      transport: tcp

validation:
  rov: true
  aspa: true
  aspa-default-procedure: upstream

outputs:
  prometheus:
    listen: "0.0.0.0:9595"
    path: "/metrics"

logging:
  level: info
  format: text
