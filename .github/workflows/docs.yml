name: Docs

on:
  pull_request:
    paths: ["docs/**", "zensical.toml", "CHANGELOG.md", "requirements-docs.txt", ".github/workflows/docs.yml"]
  push:
    branches: [main]
    paths: ["docs/**", "zensical.toml", "CHANGELOG.md", "requirements-docs.txt", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-docs.txt
      - run: zensical build --strict
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # Publishes to GitHub Pages. Needs Pages enabled (source: GitHub Actions) and the
  # repository variable DOCS_DEPLOY=true, both set by a repo admin.
  deploy:
    if: github.event_name != 'pull_request' && vars.DOCS_DEPLOY == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
